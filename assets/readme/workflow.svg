<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">dsh-attention 数据流</title>
  <desc id="desc">四路任务信号（agent 状态、goal、后台任务、任务看板）进入监控器，引擎按节奏推送活动建议，面板轮询展示；点已完成立即推进下一个。</desc>

  <rect width="1200" height="240" rx="26" fill="#0d1117"/>

  <!-- signal sources -->
  <g transform="translate(40 40)">
    <rect x="0" y="0" width="180" height="56" rx="14" fill="#161b22" stroke="#21262d" stroke-width="2"/>
    <circle cx="22" cy="28" r="5" fill="#2dd4bf"/>
    <text x="36" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#e6edf3">agent/status</text>

    <rect x="0" y="72" width="180" height="56" rx="14" fill="#161b22" stroke="#21262d" stroke-width="2"/>
    <circle cx="22" cy="100" r="5" fill="#f0b429"/>
    <text x="36" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#e6edf3">goal / jobs</text>

    <rect x="0" y="144" width="180" height="56" rx="14" fill="#161b22" stroke="#21262d" stroke-width="2"/>
    <circle cx="22" cy="172" r="5" fill="#b48ce0"/>
    <text x="36" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" font-weight="600" fill="#e6edf3">task-board</text>
  </g>

  <!-- arrows into monitor -->
  <g stroke="#30363d" stroke-width="2" fill="none">
    <path d="M220 68 h56"/>
    <path d="M220 100 h56"/>
    <path d="M220 172 h56"/>
  </g>

  <!-- monitor -->
  <rect x="276" y="40" width="200" height="160" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="376" y="76" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#e6edf3">TaskMonitor</text>
  <text x="376" y="110" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#9da7b3">task-start/end</text>
  <text x="376" y="144" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#9da7b3">重启自动补种</text>
  <text x="376" y="170" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#9da7b3">已运行窗口</text>

  <path d="M476 120 h56" stroke="#30363d" stroke-width="2" fill="none"/>

  <!-- engine -->
  <rect x="532" y="40" width="200" height="160" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="632" y="76" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#e6edf3">ReminderEngine</text>
  <text x="632" y="110" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#9da7b3">suggestion</text>
  <text x="632" y="144" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#9da7b3">活动池轮询 · 5s 首提</text>
  <text x="632" y="170" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#9da7b3">自定义活动表</text>

  <path d="M732 120 h56" stroke="#30363d" stroke-width="2" fill="none"/>

  <!-- panel -->
  <rect x="788" y="40" width="200" height="160" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="812" cy="68" r="5" fill="#2dd4bf"/>
  <text x="826" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20" font-weight="600" fill="#e6edf3">浮动面板</text>
  <text x="988" y="74" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#7d8590">3s 轮询</text>
  <text x="888" y="108" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#9da7b3">显示运行时长</text>
  <text x="888" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#9da7b3">建议与倒计时</text>
  <text x="888" y="170" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#2dd4bf">已完成 → 立即下一个</text>

  <!-- back arrow: advance -->
  <path d="M888 200 v18 h-356 v-12" stroke="#f0b429" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
  <text x="888" y="226" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#f0b429">POST /api/attention/advance</text>
</svg>
